<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stagebedrijven - Technische Natuurkunde</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="subpage-header">

  <a href="index.html" class="back-link">
    <img src="images/icons/left_arrow.svg"
         class="back-icon"
         alt=""
         width="26"
         height="26">

    <span>Lijst</span>
  </a>

</header>

<main class="info-page">

  <section class="info-card search-card">

    <div class="search-header">
      <h2>Zoeken</h2>
      <p>Zoek op naam, plaats, provincie, type, domein of beschrijving.</p>
    </div>

    <div class="search-row">

      <input
        type="text"
        id="zoekInput"
        class="search-input"
        placeholder="Bijvoorbeeld: Amsterdam, fotonica, energie..."
        autocomplete="off"
      >

      <select id="provincieFilter" class="search-select">
        <option value="">Alle regios</option>
      </select>

      <button id="resetZoekopdracht"
              class="search-reset-button"
              type="button">
        Wissen
      </button>

    </div>

  </section>

  <section id="zoekStatus"
           class="search-status"
           aria-live="polite"></section>

  <section id="domeinLijst"
           class="accordion"></section>

</main>
